<div id="loadingOverlay" class="loading">

  <span class="loading-label">Loading connections...</span>
</div>

<div class="connection-list hidden" id="connectionList">

</div>

<div class="sidebar-actions hidden" id="sidebarActions">
  <button class="btn btn-secondary" id="btnRefresh">Refresh</button>
  <button class="btn btn-primary" id="btnOpenSettings">Settings</button>
</div>
